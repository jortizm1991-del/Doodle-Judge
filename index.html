<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff8ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Doodle Judge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff8ec; --ink:#2a2238; --muted:#776d86; --line:#eadcc6; --card:#ffffff;
  --red:#ff5a3c; --red-d:#cf3a1f; --teal:#14a68c; --teal-d:#0c7a66; --imp:#7b4dff; --imp-d:#5530d6;
  --gold:#ffbf2e; --gold-d:#d99a00; --shadow:0 3px 0 rgba(42,34,56,.10); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper) radial-gradient(rgba(42,34,56,.07) 1px,transparent 1.3px) 0 0/18px 18px;color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3,.big,.code,.btn,.timer,.word,.seg button,.logo,.lt{font-family:"Baloo 2",system-ui,sans-serif}
h1{font-size:34px;line-height:1.05;margin:6px 0 4px}
h2{font-size:24px;line-height:1.15;margin:4px 0 8px}
h3{font-size:18px;margin:2px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  background:rgba(255,248,236,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
#me{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Baloo 2",system-ui;font-size:19px}
#right{display:flex;gap:6px;align-items:center}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(30px + env(safe-area-inset-bottom))}
body.tv main{max-width:1180px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:11px 16px;font-size:21px;font-weight:800;color:#fff;background:var(--red);
  box-shadow:0 4px 0 var(--red-d);cursor:pointer;margin:10px 0;touch-action:manipulation;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 var(--teal-d)}
.btn.imp{background:var(--imp);box-shadow:0 4px 0 var(--imp-d)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{font-size:16px;padding:7px 12px;border-radius:12px;width:auto;display:inline-block;margin:4px 0}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.icon{border:2px solid var(--line);background:#fff;border-radius:12px;min-width:38px;height:38px;font-size:18px;cursor:pointer;padding:0 8px;color:var(--ink);line-height:1}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block;flex:none}
.dot.ok{background:#2fbf5b}.dot.bad{background:#e8322c}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.logo{font-size:44px;font-weight:800;line-height:1;margin:18px 0 2px;text-align:center}
.logo span{display:inline-block;transform:rotate(-3deg);color:var(--red)}
.logo b{display:inline-block;transform:rotate(2deg);color:var(--imp)}
.tag{text-align:center;color:var(--muted);margin:2px 0 14px}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input.t,textarea.t{width:100%;font:inherit;font-size:20px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
input.t:focus,textarea.t:focus{border-color:var(--teal)}
input.code-in{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:30px}
textarea.t{font-size:16px;min-height:90px}
.code{font-size:46px;font-weight:800;letter-spacing:7px;line-height:1;text-align:center}
.qr{display:block;margin:8px auto;width:190px;height:190px;background:#fff;border-radius:10px}
body.tv .qr{width:300px;height:300px}
.qr svg{display:block;width:100%;height:100%}
.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-weight:700}
.chip.off{opacity:.45}
.chip.pick{border-color:var(--imp);background:#efe8ff}
.chip .x{border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;padding:0 2px}
button.chip{cursor:pointer;font:inherit;font-weight:700;color:var(--ink)}
.av{width:28px;height:28px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;font-family:"Baloo 2",system-ui,sans-serif}
.seg{display:flex;background:#f3ead9;border-radius:12px;padding:3px;gap:3px;flex-wrap:nowrap}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:6px 6px;font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;min-width:44px}
.seg button.on{background:#fff;box-shadow:0 2px 0 var(--line)}
select.t{width:100%;font:inherit;font-size:17px;padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.set{display:grid;grid-template-columns:1fr;gap:4px}
.set .k{font-weight:700;font-size:15px;margin-top:8px}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.summary span{background:#f3ead9;border-radius:10px;padding:3px 9px;font-size:14px;font-weight:600}
/* secret card */
.secret{position:relative;min-height:220px;border-radius:24px;background:#2a2238;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;cursor:pointer;touch-action:none;margin:12px 0;box-shadow:0 5px 0 #15101e}
.secret .cover{font-family:"Baloo 2",system-ui,sans-serif;font-size:24px;font-weight:800}
.secret .word{font-size:46px;font-weight:800;line-height:1;margin:6px 0;color:#ffd84a;word-break:break-word}
.secret .lbl{opacity:.8;font-size:15px}
.secret .role{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:24px;color:#ff8fb1;margin-bottom:4px}
.peek{display:flex;align-items:center;justify-content:center;gap:8px;background:#2a2238;color:#fff;border-radius:14px;padding:9px 12px;margin:10px 0;
  font-weight:700;cursor:pointer;touch-action:none;min-height:44px;text-align:center}
.peek b{color:#ffd84a}
/* drawing */
.turnbar{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.turnbar .who{flex:1;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.1}
.who.long{font-size:18px}
.timer{font-size:30px;font-weight:800;min-width:48px;text-align:right}
.timer.low{color:var(--red)}
.tbar{height:9px;border-radius:9px;background:#efe3cf;overflow:hidden;margin:2px 0 8px}
.tbar i{display:block;height:100%;background:var(--teal);width:100%;transition:width .2s linear}
.tbar.low i{background:var(--red)}
.boardwrap{position:relative;background:#fff;border-radius:18px;border:3px solid var(--ink);overflow:hidden;box-shadow:0 4px 0 rgba(42,34,56,.15);aspect-ratio:1}
.boardwrap canvas{display:block;width:100%;height:100%;touch-action:none}
.boardwrap.mine{border-color:var(--teal)}
.boardwrap.sabw{border-color:var(--imp)}
.boardwrap .over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);font-family:"Baloo 2",system-ui,sans-serif;font-size:26px;font-weight:800;text-align:center;padding:20px}
.boardwrap .over.blind{background:#2a2238;color:#fff;pointer-events:none;z-index:2}
body.tv .boardwrap{max-width:calc(100vh - 230px);margin:0 auto}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif}
.tabs button.on{border-color:var(--ink);background:#fff3c4}
.tabs button.sab.on{border-color:var(--imp);background:#efe8ff}
.tools{display:flex;gap:6px;margin:10px 0 6px}
.tools button{flex:1;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.tools button.on{border-color:var(--ink);background:#fff3c4}
.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.colors button{aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;touch-action:manipulation;padding:0}
.colors button.on{outline:3px solid var(--ink);outline-offset:2px}
.sizes{display:flex;gap:6px;margin-top:8px}
.sizes button{flex:1;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.sizes button.on{border-color:var(--ink);background:#fff3c4}
.sizes i{display:block;border-radius:50%;background:var(--ink)}
.bigwait{text-align:center;padding:26px 14px}
.bigwait .e{font-size:64px;line-height:1}
/* drawing cards */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.tv .dgrid{grid-template-columns:repeat(4,1fr)}
.dcard{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:6px}
.dcard.fav{border-color:var(--gold);background:#fff6d6;box-shadow:0 0 0 3px rgba(255,191,46,.35)}
.dcard .lt{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;border-radius:10px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;z-index:1}
.dcard .crownmark{position:absolute;top:6px;right:8px;font-size:30px;z-index:1}
.dcard img,.dcard .ph{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:#fff;display:block;cursor:zoom-in}
.dcard .ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px;cursor:default}
.dcard .btn{margin:0;font-size:17px;padding:7px}
.dcard .nm{display:flex;align-items:center;gap:6px;font-weight:800;min-width:0;font-size:15px}
.dcard .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .by{font-size:13px;color:var(--imp);font-weight:700}
.tries{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.tries span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-family:"Baloo 2",system-ui,sans-serif;font-size:18px}
.tries span.no{border-color:#e8a59a;background:#fff1ec;text-decoration:line-through}
.tries span.yes{border-color:var(--teal);background:#e3f7f2}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices .btn{margin:0;font-size:18px;padding:10px 6px;text-transform:none}
.gform{display:flex;gap:8px;align-items:stretch;margin:8px 0}
.gform input{flex:1;min-width:0}
.gform .btn{width:auto;margin:0;padding:8px 16px}
/* results */
.reveal{text-align:center;border-radius:24px;padding:18px 14px;color:#fff;background:var(--imp);box-shadow:0 5px 0 var(--imp-d);margin:10px 0}
.reveal.ok{background:var(--teal);box-shadow:0 5px 0 var(--teal-d)}
.reveal.no{background:#8b8494;box-shadow:0 5px 0 #625b6b}
.reveal.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-d)}
.reveal.dark{background:#2a2238;box-shadow:0 5px 0 #15101e}
.reveal .big{font-size:28px;font-weight:800;line-height:1.1}
.reveal .w{display:inline-block;background:rgba(255,255,255,.2);border-radius:12px;padding:2px 12px;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:26px;margin-top:6px}
.favpic{display:block;width:min(260px,70%);margin:10px auto 4px;border-radius:16px;border:3px solid rgba(0,0,0,.15);background:#fff}
.score{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px dashed var(--line)}
.score:last-child{border-bottom:0}
.score .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .p{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:22px}
.score .g{font-weight:800;color:var(--teal);min-width:34px;text-align:right}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 6px}
.podium>div{flex:1;max-width:120px;line-height:1.2;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-align:center;border-radius:14px 14px 0 0;color:#fff;padding:8px 4px;font-weight:800;font-family:"Baloo 2",system-ui,sans-serif}
.podium .n{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twist{background:#e9e1ff;border:2px solid #cbb8ff;border-radius:16px;padding:10px 12px;margin:8px 0;text-align:center}
.judgebar{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff3c4;border:2px solid #f1d77a;border-radius:14px;padding:6px 10px;margin:6px 0;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;z-index:50;
  font-weight:700;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.banner{background:#fff3c4;border:2px solid #f1d77a;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:600;font-size:15px}
.banner.lock{background:#2a2238;color:#fff;border-color:#2a2238;text-align:center;font-size:17px}
.modal{position:fixed;inset:0;background:rgba(30,24,40,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--paper);border-radius:22px;padding:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.modal img{width:100%;border-radius:14px;border:2px solid var(--line);background:#fff;display:block}
.rules li{margin:4px 0}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:4px 0}
.wobble{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.pulse{animation:pul 1s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<header><div id="me">👑 Doodle Judge</div><div id="right"></div></header>
<main id="main"></main>

  return s;
}

function hCheckDraw() {

  if (all) {
    clearTimeout(H.legT);

}

}
function hGuess(id, m) {

}
function hPick(id, k) {

function hAccuse(id, to) {

  S.accuse = to; st.pick.accDone = true;

  hCheckPick();
}
function hCheckPick() {

}
// host override: "that typo counts!"
function hCountIt() {
  const st = H.st;

  st.guess.ok = true; st.guess.over = true;

}
function hResult(r) {
  const st = H.st, S = H.sec;
  clearTimeout(H.pickT);
  const gains = {};
  const add = (id, n) => { if (st.parts.includes(id)) gains[id] = (gains[id] || 0) + n; };
  let fav = null, favArtists = [], acc = null;
  if (!r.aborted) {

    owners: st.drawers.slice(), artists: S.artists, fav, favArtists, acc,
    odd: S.odd, oddWord: S.oddWord, oddHit: !!S.oddHit, gains, aborted: r.aborted || null };

function hNext() {

  Object.assign(st, { phase: "lobby", round: 0, maxR: 0, rid: "", judge: "", drawers: [], parts: [], cards: [], doneK: [], guess: null, pick: null, res: null });
  H.judgeCount = {}; H.sabCount = {}; H.oddCount = {}; H.lastJudge = ""; H.deadline = 0; H.twistBag = null;
  hPublish();
}
function hRemove(id) {
  const st = H.st;
  if (id === H.me.id || !hP(id)) return;
  st.players = st.players.filter((x) => x.id !== id);
  hPriv(id, { t: "kick" });
  if (inRound() && st.parts.includes(id)) {
    if (id === st.judge) return hResult({ aborted: "judge" });
    st.parts = st.parts.filter((x) => x !== id);
    if (st.parts.length < 3) return hResult({ aborted: "few" });
    if (st.phase === "reveal") hCheckReady();
    if (st.phase === "draw") hCheckDraw();

  if (!H) return;

  let changed = false;
  for (const p of st.players) { const on = hOnline(p.id); if (on !== p.on) { p.on = on; changed = true; } }

  if (st.phase === "draw" && H.deadline && t0 > H.deadline + 1500) hEndLeg();
  else if (st.phase === "guess" && H.deadline && t0 > H.deadline + 800) hGuessDone(false);
  else if (st.phase === "pick" && H.deadline && t0 > H.deadline + 800) hResult({});

function hostConnect() {
  C.conn?.close();
  const code = H.code, top = TOP(code);
  C.code = code;
  C.conn = relay(brokerFor(code), {
    onStatus(up) { setDot(up); if (up) hPublish(); },
    onMessage(topic, m) {
      if (topic === top + "/h") hMsg(m);
      else if (topic.startsWith(top + "/d/")) { if (m.by !== H.me.id) { hDraw(m); onDraw(m); } }
    },
  });
  C.conn.sub(top + "/h");
  C.conn.sub(top + "/d/#");
  clearTimeout(H.fallT);
  if (!OVERRIDE && H.st.phase === "lobby" && H.st.players.length === 1) {
    H.fallT = setTimeout(() => {
      if (C.conn?.up || !H || H.st.players.length > 1) return;
      H.brokerIdx = (H.brokerIdx + 1) % BROKERS.length;
      H.code = makeCode(H.brokerIdx);

}
function hostStart(name, resume) {

  C.isHost = true; C.tv = false; C.screen = "room";
  C.st = null; C.priv = null; C.gal = {}; C.galRid = ""; C.pads = {};
  LANG = H.st.lang;
  hostConnect();
  clearInterval(C.hostTimer); C.hostTimer = setInterval(hTick, 250);
  onState(JSON.parse(JSON.stringify(H.st)));
  if (H.sec && inRound()) hSendRole(H.me.id);
  hPublish();
  for (const k of Object.keys(H.slots || {})) hSendSlot(+k);

// =====================================================================
//  CLIENT — every device (host included) uses this to show the game.
// =====================================================================
const C = {
  screen: "home", code: "", me: null, isHost: false, tv: false, conn: null,
  st: null, stAt: 0, priv: null, gal: {}, galRid: "", pads: {}, watch: null, tab: 0,
  lastHello: 0, lastPing: 0, lastNeed: 0, joinAt: 0, key: "", upd: null,
};
function sendHost(m) {
  m.id = C.me?.id || m.id;
  if (C.isHost) hMsg(m);
  else C.conn?.pub(TOP(C.code) + "/h", m);
}
function setDot(up) { const d = $("#cdot"); if (d) d.className = "dot " + (up ? "ok" : "bad"); C.up = up; }

function joinRoom(code, name, tv) {
  C.conn?.close();
  code = code.toUpperCase();
  C.code = code; C.tv = !!tv; C.isHost = false; C.screen = "room";
  C.st = null; C.priv = null; C.gal = {}; C.galRid = ""; C.pads = {}; C.watch = null; C.joinAt = now();
  if (!tv) {
    const saved = store.get("dj_player");
    const id = saved && saved.code === code ? saved.id : rid(8);
    C.me = { id, name };
    store.set("dj_player", { code, id, name, ts: now() });
  } else C.me = { id: "tv" + rid(4), name: "TV" };
  document.body.classList.toggle("tv", !!tv);
  const top = TOP(code);
  C.conn = relay(brokerFor(code), {
    onStatus(up) { setDot(up); if (up) hello(true); },
    onMessage(topic, m) {
      if (topic === top + "/s") onState(m);
      else if (topic.startsWith(top + "/d/")) { if (m.by !== C.me.id) onDraw(m); }
      else if (topic === top + "/g") onGal(m);
      else if (topic === top + "/p/" + C.me.id) onPriv(m);
    },
  });
  for (const s of ["/s", "/g", "/p/" + C.me.id]) C.conn.sub(top + s);
  keepAwake();
  render();
}
function hello(force) {
  if (!C.code || C.isHost || !C.conn) return;
  if (!force && now() - C.lastHello < 2500) return;
  C.lastHello = now();
  sendHost({ t: "hello", name: C.me.name, tv: C.tv || undefined });
}
const myPriv = () => (C.priv && C.st && C.priv.rid === C.st.rid ? C.priv : null);
function onState(st) {
  if (!st || (C.st && st.hid === C.st.hid && st.v < C.st.v && !C.isHost)) return;
  const prev = C.st;
  C.st = st; C.stAt = now();
  if (st.lang !== LANG) LANG = st.lang;
  if (st.rid !== C.galRid) { C.gal = {}; C.galRid = st.rid; C.watch = null; C.tab = 0; C.myPick = null; C.myAcc = null; }
  if (!C.isHost && !C.tv && !st.players.some((p) => p.id === C.me.id)) {
    if (now() - C.joinAt > 1500) hello();
  }
  // the drawing part (or this half of it) is over → wrap up my cards
  for (const pad of Object.values(C.pads))
    if (!pad.fin && (pad.rid !== st.rid || pad.leg !== st.leg || st.phase !== "draw")) finishPad(pad);
  if (prev && prev.phase !== st.phase) {
    if (st.phase === "reveal") { beep(520, .15); beep(780, .2); buzz(80); }
    if (st.phase === "draw") { beep(700, .12); setTimeout(() => beep(990, .18), 140); buzz([60, 40, 60]); }
    if (st.phase === "guess") { beep(440, .15); buzz(60); }
    if (st.phase === "pick") st.guess?.ok ? (beep(880, .15), setTimeout(() => beep(1180, .2), 150)) : beep(300, .3);
    if (st.phase === "result") beep(880, .25);
  } else if (prev && st.phase === "draw" && prev.leg !== st.leg) { beep(600, .12); setTimeout(() => beep(900, .15), 130); buzz([50, 30, 50]); }
  render();
}
function onPriv(m) {
  if (!m) return;
  if (m.t === "role") { C.priv = m; render(); }
  else if (m.t === "resume") gotResume(m);
  else if (m.t === "kick") { leaveRoom(); toast(t("removed")); }
  else if (m.t === "full") { leaveRoom(); toast(t("full")); }
}
// live drawing coming in — only the locked-out player watches one (their own card)
function onDraw(m) {
  const st = C.st, W2 = C.watch;
  if (!st || !W2 || m.rid !== st.rid || m.k !== W2.k || m.leg !== st.leg) return;
  const before = W2.tok.length;
  if (m.app) return;
  W2.tok = mergeTok(W2.tok, m);
  if (W2.board) { if (m.full || m.fin) W2.board.load(W2.tok); else if (W2.tok.length > before) W2.board.push(W2.tok.slice(before)); }
}
function onGal(m) {
  if (!C.st || m.rid !== C.st.rid) return;
  const old = C.gal[m.k];
  if (old && old.tok.length === m.tok.length) return;
  C.gal[m.k] = { tok: m.tok };
  C.galDirty = true;
}
function leaveRoom(sendLeave) {
  if (sendLeave && !C.isHost && C.code) sendHost({ t: "leave" });
  if (C.isHost) { store.set("dj_host", null); clearInterval(C.hostTimer); H = null; }
  else store.set("dj_player", null);
  for (const pad of Object.values(C.pads)) clearInterval(pad.flushT);
  setTimeout(() => C.conn?.close(), sendLeave ? 300 : 0);
  Object.assign(C, { screen: "home", code: "", isHost: false, tv: false, st: null, priv: null, gal: {}, pads: {}, watch: null, key: "" });
  document.body.classList.remove("tv");
  history.replaceState(null, "", location.pathname + (OVERRIDE ? "?broker=" + encodeURIComponent(OVERRIDE) : ""));
  render();
}

// ---- my cards ("pads"). A pad streams one card to the host while I draw it. ----
//  A pad doesn't send anything until the host has told it what's already on the
//  card (nothing at the start, earlier lines after a reload or a Pass-it-on).
const padKey = (r, leg, k) => r + ":" + leg + ":" + k;
function makePad(board, k) {
  const st = C.st, key = padKey(st.rid, st.leg, k);
  let pad = C.pads[key];
  if (pad) {
    const old = pad.board;
    board.tool = old.tool; board.color = old.color; board.size = old.size;
    board.load(pad.tok);
    pad.board = board;
    if (!pad.fin && !pad.lineUsed) padInput(pad);
    return pad;
  }
  pad = { key, rid: st.rid, leg: st.leg, k, board, tok: [], sent: 0, lastSnap: now(), snapLen: 0, fin: false, ready: false, askAt: 0 };
  C.pads[key] = pad;
  padInput(pad);
  askResume(pad);
  pad.flushT = setInterval(() => flushPad(pad), 100);
  return pad;
}
function padInput(pad) {
  const b = pad.board;
  b.enableInput((arr) => { if (pad.board === b && !pad.fin) pad.tok.push(...arr); },
    C.st.twist === "oneline" ? { oneStroke: true, onStroke: () => { pad.lineUsed = true; setTimeout(() => { finishPad(pad); render(); }, 400); } } : {});
}
function askResume(pad) { pad.askAt = now(); sendHost({ t: "resume", rid: pad.rid, leg: pad.leg, k: pad.k }); }
function gotResume(m) {
  const pad = C.pads[padKey(m.rid, m.leg, m.k)];
  if (!pad || pad.ready) return;
  pad.ready = true;
  if (m.tok.length) {
    pad.tok = pad.tok.length ? m.tok.concat([OP_E], pad.tok) : m.tok.slice();
    pad.board.load(pad.tok);
  }
  if (m.fin) { pad.fin = true; clearInterval(pad.flushT); pad.board.stop?.(); render(); return; }
  // One line only: if I reloaded after starting my line, that line was my one stroke
  if (C.st?.twist === "oneline" && m.tok.length) { pad.lineUsed = true; pad.sent = 0; finishPad(pad); render(); return; }
  if (pad.tok.length) pubDraw({ rid: pad.rid, leg: pad.leg, k: pad.k, full: true, tok: pad.tok });
  pad.sent = pad.snapLen = pad.tok.length; pad.lastSnap = now();
}
function pubDraw(m) {
  m.by = C.me.id;
  C.conn?.pub(TOP(C.code) + "/d/" + m.k, m);
  if (C.isHost) hDraw(m);
}
function flushPad(pad) {
  if (pad.fin) return;
  if (!pad.ready) { if (now() - pad.askAt > 1500) askResume(pad); return; }
  if (pad.tok.length > pad.sent) {
    pubDraw({ rid: pad.rid, leg: pad.leg, k: pad.k, from: pad.sent, tok: pad.tok.slice(pad.sent) });
    pad.sent = pad.tok.length;
  }
  if (now() - pad.lastSnap > 2500 && pad.snapLen !== pad.tok.length) {
    pad.lastSnap = now(); pad.snapLen = pad.tok.length;
    pubDraw({ rid: pad.rid, leg: pad.leg, k: pad.k, full: true, tok: pad.tok });
  }
}
function finishPad(pad) {
  if (!pad || pad.fin) return;
  pad.board.stop?.();
  flushPad(pad);
  pad.fin = true; clearInterval(pad.flushT);
  const m = { rid: pad.rid, leg: pad.leg, k: pad.k, fin: true, tok: pad.tok.slice() };
  if (!pad.ready) m.app = true;
  pubDraw(m);
  // send the final copy twice in case one gets lost
  setTimeout(() => { if (C.st && C.st.rid === pad.rid) pubDraw(Object.assign({}, m)); }, 900);
}
const activePads = () => Object.values(C.pads).filter((p) => C.st && p.rid === C.st.rid && p.leg === C.st.leg);

// ---- client timer loop ----
const deadline = () => C.st ? C.stAt + (C.st.left || 0) : 0;
function clientTick() {
  const st = C.st;
  if (C.screen === "room" && C.code) {
    if (!C.isHost) {
      if (!st) hello();
      else if (now() - C.stAt > 12000) { $("#hostBanner") || $("#main").prepend(el("div", { class: "banner", id: "hostBanner" }, "⏳ " + t("hostBack"))); hello(); }
      else $("#hostBanner")?.remove();
      if (!C.tv && now() - C.lastPing > 5000) { C.lastPing = now(); sendHost({ t: "ping" }); }
      if (st && !C.tv && (!myPriv() || myPriv().leg !== st.leg) && ["reveal", "draw", "guess", "pick"].includes(st.phase) && st.parts.includes(C.me.id)) hello();
      if (st && ["guess", "pick", "result"].includes(st.phase)) {
        const miss = st.cards.filter((k) => !C.gal[k]);
        if (miss.length && now() - C.lastNeed > 3000 && now() - C.stAt < 12000) { C.lastNeed = now(); sendHost({ t: "need", rid: st.rid, ks: miss }); }
      }
    }
    if (C.galDirty) { C.galDirty = false; C.updGal?.(); }
  }

}
let lastTickSec = -1;
function tickFrame() {
  const st = C.st;
  if (!st || !st.total) return;
  const left = Math.max(0, deadline() - now()), s = Math.ceil(left / 1000);
  document.querySelectorAll(".timer").forEach((e) => { e.textContent = s; e.classList.toggle("low", s <= 5); });
  document.querySelectorAll(".tbar").forEach((e) => { e.firstChild.style.width = (100 * left) / st.total + "%"; e.classList.toggle("low", s <= 5); });
  if (st.phase === "draw" && s !== lastTickSec) {
    lastTickSec = s;
    if (s <= 5 && s > 0 && activePads().some((p) => !p.fin)) beep(880, 0.06, 0.08);
  }
  if (st.phase === "draw" && left <= 0) {
    let any = false;
    for (const pad of activePads()) if (!pad.fin) { finishPad(pad); any = true; }
    if (any) render();
  }
}
setInterval(clientTick, 150);

    right.append(el("button", { class: "icon", title: t("sound"), onclick: () => { muted = !muted; store.set("dj_mute", muted); header(); } }, muted ? "🔇" : "🔊"));

  } else {

    right.append(el("div", { class: "seg" },
      ["en", "es"].map((l) => el("button", { class: LANG === l ? "on" : "", onclick: () => { LANG = l; store.set("dj_lang", l); render(); } }, l.toUpperCase()))));

const closeBtn = () => el("button", { class: "btn ghost", onclick: (e) => e.target.closest(".modal").remove() }, t("close"));
function openMenu() {

    if (st.phase !== "lobby" && st.phase !== "final") items.push(el("button", { class: "btn ghost", onclick: () => { if (confirm(t("endConfirm"))) { m.remove(); hEnd(); } } }, "🏁 " + t("endGame")));
  }
  items.push(el("button", { class: "btn ghost", onclick: () => { m.remove(); showRules(); } }, "❓ " + t("howTo")));

  } else if (role === "judge") {
    who.textContent = t("youJudge");
    kids.push(el("div", { class: "card bigwait" }, el("div", { class: "e wobble" }, "👑"), el("h2", {}, t("judgeWait")),
      pv.cat ? el("p", {}, t("category2", { c: pv.cat })) : null), prog.el);
  } else if (!slots.length) {
    // 🔒 locked out: watch someone draw my card live
    who.textContent = role === "locked" ? t("youLocked") : "🎨 " + t("watchWait");
    if (role === "locked" && pv.own >= 0) {
      const cv = el("canvas", {}), board = new Board(cv);
      C.conn?.sub(TOP(C.code) + "/d/" + pv.own);
      if (!C.watch || C.watch.k !== pv.own || C.watch.rid !== st.rid) C.watch = { rid: st.rid, k: pv.own, tok: [], board: null };
      board.load(C.watch.tok); C.watch.board = board;
      kids.push(el("div", { class: "banner lock" }, t("lockedWatch")), el("div", { class: "boardwrap sabw" }, cv), el("p", { class: "hint" }, t("lockedMuted")));
    } else if (st.twist === "pass" && st.leg === 1) kids.push(el("p", { class: "hint" }, t("passWait")));
    kids.push(prog.el, peekBox());
  } else {
    // I draw one card (or two, if I'm the saboteur)
    const pads = [], wraps = [];
    if (C.tab >= slots.length) C.tab = 0;
    const owner = (k) => st.drawers[k];
    const labelFor = (k) => owner(k) === C.me.id ? "🎨 " + t("yourCard") : "😈 " + t("forName", { name: pName(owner(k)) });
    const passing = st.twist === "pass" && st.leg === 2;
    const k0 = slots[0];
    who.textContent = passing ? t("passNow", { name: pName(owner(k0)) }) : t("drawThis", { w: pv.word });
    if (who.textContent.length > 26) who.classList.add("long");
    for (const k of slots) {
      const cv = el("canvas", {}), board = new Board(cv);
      const mineCls = owner(k) === C.me.id ? " mine" : " sabw";
      const wrap = el("div", { class: "boardwrap" + mineCls }, cv);
      const pad = makePad(board, k);
      if (st.twist === "blind" && !pad.fin) wrap.append(el("div", { class: "over blind" }, t("blindCover")));
      if (pad.fin) wrap.append(el("div", { class: "over fin" }, "✓"));
      pads.push(pad); wraps.push(wrap);
    }
    const tabs = slots.length > 1 ? el("div", { class: "tabs" }) : null;
    const cur = () => pads[C.tab];
    const showTab = () => {
      wraps.forEach((w, i) => (w.style.display = i === C.tab ? "" : "none"));
      if (tabs) {
        tabs.innerHTML = "";
        slots.forEach((k, i) => tabs.append(el("button", { class: (i === C.tab ? "on" : "") + (owner(k) === C.me.id ? "" : " sab"), onclick: () => { C.tab = i; showTab(); sel(); } },
          labelFor(k) + (pads[i].fin ? " ✓" : ""))));
      }
      const db = tools.querySelector(".btn.teal"); if (db) db.disabled = cur().fin || null;
    };
    const tb = (id, icon, title) => el("button", { "data-t": id, title, onclick: () => { cur().board.tool = id; sel(); } }, icon);
    const sel = () => {
      const b = cur().board;
      tools.querySelectorAll(".tools button[data-t]").forEach((x) => x.classList.toggle("on", x.dataset.t === b.tool));
      tools.querySelectorAll(".colors button").forEach((x, i) => x.classList.toggle("on", i === b.color && b.tool !== "eraser"));
      tools.querySelectorAll(".sizes button").forEach((x, i) => x.classList.toggle("on", i === b.size));
    };
    const oneLine = st.twist === "oneline";
    const tools = el("div", {},
      oneLine ? el("p", { class: "hint" }, t("oneLineTip")) : el("div", { class: "tools" },
        tb("pen", "✏️", t("tools").pen), tb("fill", "🪣", t("tools").fill), tb("eraser", "🧽", t("tools").eraser),
        el("button", { title: t("tools").undo, onclick: () => cur().board.act("undo") }, "↩️"),
        el("button", { title: t("tools").clear, onclick: () => cur().board.act("clear") }, "🗑️")),
      el("div", { class: "colors" }, PAL.map((c, i) => el("button", { style: `background:${c}`, "aria-label": c, onclick: () => { const b = cur().board; b.color = i; if (b.tool === "eraser") b.tool = "pen"; sel(); } }))),
      el("div", { class: "sizes" }, SIZES.map((s, i) => el("button", { onclick: () => { cur().board.size = i; sel(); } }, el("i", { style: `width:${Math.max(6, s * 0.55)}px;height:${Math.max(6, s * 0.55)}px` })))),
      el("button", { class: "btn teal", onclick: () => {
        finishPad(cur());
        const next = pads.findIndex((p) => !p.fin);
        if (next >= 0) C.tab = next;
        render();
      } }, t("done")));
    if (pv.role === "sab") kids.push(el("div", { class: "banner lock" }, t("sabTip", { name: pName(pv.victim) })));
    kids.push(tabs, ...wraps, tools, prog.el, peekBox());
    showTab(); sel();
    upd2 = () => {
      pads.forEach((p, i) => {
        if (p.fin && !wraps[i].querySelector(".over.fin")) { wraps[i].querySelector(".blind")?.remove(); wraps[i].append(el("div", { class: "over fin" }, p.lineUsed ? "✓" : "⏰ " + t("timesUp"))); }
      });
      showTab();
    };
  }
  if (C.tv) screen(el("div", {}, top, judgeBar(), el("div", { class: "card bigwait" }, el("div", { class: "e wobble" }, "✏️"), el("h2", {}, t("watchWait"))), prog.el));
  else screen(...kids);
  C.upd = () => { prog.fill(); upd2?.(); };
}

// ---- judge guesses the word ----
function triesBox() {
  const box = el("div", { class: "tries" });
  const fill = () => {
    box.innerHTML = "";
    for (const tr of C.st.guess?.tries || []) box.append(el("span", { class: tr.ok ? "yes" : "no" }, tr.txt));
  };
  fill();
  return { el: box, fill };
}
function guessScreen() {
  const st = C.st, g = st.guess, isJudge = st.judge === C.me.id && !C.tv;
  const jn = pName(st.judge);
  const grid = cardsGrid();
  const tries = triesBox();
  const kids = [el("div", { class: "turnbar" }, el("div", { class: "who" }, isJudge ? t("guessYou") : t("guessOther", { name: jn })), el("div", { class: "timer" })),
    el("div", { class: "tbar" }, el("i"))];
  let input = null, btn = null, lastN = g.tries.length;
  if (isJudge) {
    if (g.mode === "pick") {
      kids.push(el("div", { class: "choices" }, g.choices.map((w, i) => el("button", { class: "btn imp",
        onclick: (e) => { sendHost({ t: "guess", i }); document.querySelectorAll(".choices .btn").forEach((b) => (b.disabled = true)); e.target.classList.add("pulse"); } }, w))));
    } else {
      input = el("input", { class: "t", placeholder: t("guessPh"), maxlength: 40, autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
      btn = el("button", { class: "btn imp", type: "submit" }, t("guessBtn"));
      kids.push(el("form", { class: "gform", onsubmit: (e) => {
        e.preventDefault();
        const v = input.value.trim(); if (!v) return;
        btn.disabled = true; input.disabled = true;
        sendHost({ t: "guess", txt: v });
      } }, input, btn), el("p", { class: "hint", id: "triesLeft" }, t("triesLeft", { n: 2 - g.tries.length })));
    }
  } else kids.push(el("p", { class: "center", style: "font-weight:800;font-size:18px" }, t("noHelp")));
  kids.push(tries.el, grid.el);
  screen(...kids);
  C.updGal = () => grid.fill();
  C.upd = () => {
    tries.fill(); grid.fill();
    const n = C.st.guess.tries.length;
    if (isJudge && input && n !== lastN) {
      lastN = n;
      if (!C.st.guess.done) { toast(t("lastTry")); beep(300, .2); buzz(120); input.disabled = false; btn.disabled = false; input.value = ""; input.focus(); }
      const tl = $("#triesLeft"); if (tl) tl.textContent = t("triesLeft", { n: Math.max(0, 2 - n) });
    }
  };
}

// ---- judge crowns a favorite (and the locked-out player names the saboteur) ----
function pickScreen() {
  const st = C.st, g = st.guess, isJudge = st.judge === C.me.id && !C.tv, jn = pName(st.judge);
  const pv = myPriv();
  const isVictim = pv?.role === "locked" && st.pick?.acc && !C.tv;
  const head = el("div", { class: "reveal " + (g.ok ? "ok" : "no") },
    el("div", { class: "big" }, g.ok ? t("gotIt", { name: jn }) : t("missed", { name: jn })),
    el("div", {}, t("wordWas") + ":"), el("div", { class: "w" }, g.word));
  const overNote = el("p", { class: "center small" });
  const tries = triesBox();
  const grid = cardsGrid({
    sel: () => (isJudge && C.myPick != null ? C.myPick : C.st.pick?.k),
    extra: isJudge ? (k) => el("button", { class: "btn gold", onclick: () => { C.myPick = k; sendHost({ t: "pick", k }); beep(700, .08); grid.fill(true); } }, t("crown")) : null,
  });
  const accBox = el("div", {});
  const fillAcc = () => {
    accBox.innerHTML = "";
    if (!isVictim) return;
    const cands = C.st.parts.filter((id) => id !== C.me.id && id !== C.st.judge);
    accBox.append(el("div", { class: "card" }, el("h3", {}, t("accuseTitle")), el("p", { class: "small muted" }, t("accuseSub")),
      el("div", { class: "players" }, cands.map((id) => el("button", { class: "chip" + (C.myAcc === id ? " pick" : ""),
        onclick: () => { C.myAcc = id; sendHost({ t: "accuse", to: id }); fillAcc(); } }, avatar(pObj(id)), pName(id)))),
      C.myAcc ? el("p", { class: "small" }, t("accusePicked", { name: pName(C.myAcc) })) : null));
  };
  fillAcc();
  const ctrl = el("div", {});
  const waitP = el("p", { class: "center muted" });
  screen(head, overNote, tries.el,
    el("div", { class: "turnbar" }, el("div", { class: "who" + (isJudge ? "" : " long") }, isJudge ? t("pickYou") : t("pickOther", { name: jn })), el("div", { class: "timer" })),
    el("div", { class: "tbar" }, el("i")),
    accBox, waitP, ctrl, grid.el);
  C.updGal = () => grid.fill();
  let lastC = "";
  C.upd = () => {
    const s = C.st;
    grid.fill(); tries.fill();
    overNote.textContent = s.guess.over ? t("overruled") : "";
    if (s.guess.ok && !head.classList.contains("ok")) { head.className = "reveal ok"; head.firstChild.textContent = t("gotIt", { name: jn }); }
    waitP.textContent = s.pick?.k != null && s.pick.acc && !s.pick.accDone && !isVictim ? t("accuseWait") : "";
    const ck = [s.guess.ok, s.pick?.k].join();
    if (ck === lastC) return; lastC = ck;
    ctrl.innerHTML = "";
    if (C.isHost) {
      if (!s.guess.ok) ctrl.append(el("button", { class: "btn ghost sm", onclick: () => hCountIt() }, t("countIt")));
      if (s.pick?.k != null) ctrl.append(el("button", { class: "btn ghost sm", style: "margin-left:6px", onclick: () => hResult({}) }, "📣 " + t("revealNow")));
    }
  };
}

// ---- round result ----
function resultScreen() {
  const st = C.st, r = st.res, jn = pName(r.judge);
  const kids = [];
  if (r.aborted) {
    kids.push(el("div", { class: "reveal no" }, el("div", { class: "big" }, t("aborted")),
      el("p", {}, r.aborted === "judge" ? t("abortJudge") : r.aborted === "few" ? t("abortFew") : ""),
      el("div", {}, t("wordWas") + ":"), el("div", { class: "w" }, r.word)));
  } else {
    kids.push(el("div", { class: "reveal " + (r.guessOk ? "ok" : "no") },
      el("div", { class: "big" }, r.guessOk ? t("gotIt", { name: jn }) : t("missed", { name: jn })),
      el("div", {}, t("wordWas") + ":"), el("div", { class: "w" }, r.word),
      r.over ? el("p", { class: "small" }, t("overruled")) : null));
    // crowned drawing
    if (r.fav != null) {
      const g = C.gal[r.fav], owner = r.owners[r.fav];
      const realOther = r.favArtists.filter((a) => a !== owner);
      kids.push(el("div", { class: "reveal gold" },
        el("div", { class: "big" }, t("favWas", { name: pName(owner) })),
        g && g.tok.length ? el("img", { class: "favpic", src: galImg(r.fav, g), onclick: () => zoomImg(galImg(r.fav, g)) }) : null,
        realOther.length ? el("p", { style: "font-weight:800" }, t("favBy", { name: realOther.map(pName).join(" & ") })) : null));
    } else kids.push(el("p", { class: "center muted" }, t("noFav")));
    // saboteur
    if (r.acc) {
      const a = r.acc, v = { sab: pName(a.sab), victim: pName(a.victim), to: pName(a.to) };
      kids.push(el("div", { class: "reveal dark" }, el("div", { class: "big", style: "font-size:22px" }, t("sabWas", v)),
        el("p", {}, !a.to ? t("accNone", v) : a.ok ? t("accRight", v) : t("accWrong", v))));
    }
    // odd one out
    if (r.odd) kids.push(el("div", { class: "reveal" }, el("div", { class: "big", style: "font-size:22px" }, t("oddWas", { name: pName(r.odd), w: r.oddWord })),
      r.oddHit ? el("p", {}, t("oddFooled", { name: pName(r.odd) })) : null));
    if (r.tries.length) kids.push(el("div", { class: "card center" }, el("h3", {}, t("judgeTries")),
      el("div", { class: "tries" }, r.tries.map((tr) => el("span", { class: tr.ok ? "yes" : "no" }, tr.txt)))));
  }
  // every card with its real artist(s)
  const grid = el("div", { class: "dgrid" });
  const fillGrid = () => {
    grid.innerHTML = "";
    st.cards.forEach((k, i) => {
      const g = C.gal[k], owner = r.owners[k], arts = r.artists[k] || [owner];
      const by = arts.length > 1 ? t("drawnBy2", { a: pName(arts[0]), b: pName(arts[1]) }) : arts[0] !== owner ? "😈 " + t("drawnBy", { name: pName(arts[0]) }) : null;
      grid.append(el("div", { class: "dcard" + (r.fav === k ? " fav" : "") },
        el("div", { class: "lt" }, LETTERS[i]), r.fav === k ? el("div", { class: "crownmark" }, "👑") : null,
        g && g.tok.length ? el("img", { src: galImg(k, g), onclick: () => zoomImg(galImg(k, g), pName(owner)) }) : el("div", { class: "ph" }, g ? "🫥" : "⏳"),
        el("div", { class: "nm" }, avatar(pObj(owner)), el("span", {}, pName(owner)), r.odd === owner ? " 🃏" : null),
        by ? el("div", { class: "by" }, by) : null));
    });
  };
  fillGrid();
  C.updGal = fillGrid;
  kids.push(el("div", { class: "card" }, el("h3", {}, t("allCards")), grid));
  kids.push(el("div", { class: "card" }, el("h3", {}, "🏆 " + t("scores")), scoreList(r.gains)));
  if (C.isHost) {
    const last = st.maxR && st.round >= st.maxR;
    kids.push(el("button", { class: "btn teal", onclick: () => hNext() }, last ? t("finalResults") : t("nextRound")));
    if (!last) kids.push(el("button", { class: "btn ghost", onclick: () => { if (confirm(t("endConfirm"))) hEnd(); } }, "🏁 " + t("endGame")));
  } else kids.push(el("p", { class: "center muted" }, t("waitNext")));
  screen(...kids);
  if (!r.aborted && r.gains[C.me.id]) buzz([60, 40, 60]);
  C.upd = null;
}

// ---- final ----
function finalScreen() {
  const st = C.st;
  const sorted = st.players.slice().sort((a, b) => b.score - a.score);
  const top = sorted[0];
  const tied = sorted.filter((p) => top && p.score === top.score);
  const podium = el("div", { class: "podium" });
  const spots = [[sorted[1], 90, "#b8b8c8", "🥈"], [sorted[0], 130, "#f2b400", "🥇"], [sorted[2], 70, "#d08a4e", "🥉"]];
  for (const [p, h, c, m] of spots) if (p) podium.append(el("div", { style: `min-height:${h}px;background:${c}` }, el("div", {}, m), el("div", { class: "n" }, p.name), el("div", {}, p.score)));
  screen(el("h1", { class: "center" }, "🎉 " + t("gameOver")),
    el("h2", { class: "center" }, tied.length > 1 ? t("tie2") : t("winner", { name: top?.name || "?" })),
    podium,
    el("div", { class: "card" }, scoreList()),
    C.isHost ? el("button", { class: "btn teal", onclick: () => hPlayAgain() }, "🔁 " + t("playAgain")) : el("p", { class: "center muted" }, t("waitNext")));
  if (st.players.length) { beep(660, .12); setTimeout(() => beep(880, .12), 150); setTimeout(() => beep(1100, .25), 300); }
  C.upd = null;
}

// ---------------------------------------------------------------------
//  Start up
// ---------------------------------------------------------------------
(function boot() {
  const l = store.get("dj_lang"); if (l === "en" || l === "es") LANG = l;
  const room = (params.get("room") || "").toUpperCase();
  const ps = store.get("dj_player");
  if (room) {
    if (ps && ps.code === room && ps.name && now() - ps.ts < 6 * 3600e3) return joinRoom(room, ps.name);
    C.screen = "join";
  } else if (ps && ps.name && now() - ps.ts < 30 * 60e3 && !store.get("dj_host")) {
    return joinRoom(ps.code, ps.name);
  } else {
    const hs = store.get("dj_host");
    if (hs && now() - hs.ts < 30 * 60e3) { H = hs.H; return hostStart(null, true); }
  }
  render();
})();
</script>
</body>
